[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cautogui"
dynamic = ["version"] 
readme = "README.md"
description = "Native high-performance UI automation for Windows"
requires-python = ">=3.7"
dependencies = [
    "Pillow>=9.0.0",
]